apiVersion: v1
kind: Namespace
metadata:
  name: companybrain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: companybrain
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: companybrain-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: companybrain-secrets } }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: companybrain
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: companybrain
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: companybrain-web:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://api:8000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: companybrain
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
# Catatan: postgres/minio/qdrant/ollama di prod disarankan pakai managed service.
# File ini hanya fondasi api+web. Buat secret: kubectl -n companybrain create secret generic companybrain-secrets --from-env-file=.env
